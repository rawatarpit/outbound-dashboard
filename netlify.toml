# Netlify Configuration
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/architecture"
  to = "/system-architecture.html"
  status = 200

[[redirects]]
  from = "/system-architecture"
  to = "/system-architecture.html"
  status = 200

[[redirects]]
  from = "/system-architecture.html"
  to = "/system-architecture.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
